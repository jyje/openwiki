name: Copilot Model Availability Live

on:
  push:
    branches:
      - test/copilot-free-model-availability

permissions:
  contents: read

concurrency:
  group: copilot-model-availability-live
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, and build
    if: github.repository == 'jyje/openwiki'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check quality
        run: |
          pnpm run format:check
          pnpm run lint:check
          pnpm run typecheck
          pnpm run build

  unit:
    name: Model availability tests (Node ${{ matrix.node-version }})
    if: github.repository == 'jyje/openwiki'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run model availability tests
        run: pnpm exec vitest run test/model-availability.test.ts

  live:
    name: Live Free account availability
    if: github.repository == 'jyje/openwiki'
    needs: [quality, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate effective Copilot model availability
        env:
          COPILOT_API_KEY: ${{ secrets.COPILOT_API_KEY }}
        run: pnpm exec tsx scripts/validate-copilot-model-availability.ts
